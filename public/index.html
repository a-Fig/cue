<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cue</title>
  <link rel="icon" href="logo-mark.svg">
  <!-- The brand kit's faces (brand/README.md). Recall's bot browser can load them; without them the
       stack falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=JetBrains+Mono&family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fixed 1280x720 stage: Recall streams the page at that size. -->
  <main id="stage">
    <header class="status">
      <img class="mark" src="logo-mark.svg" alt="">
      <span class="dot" id="dot"></span>
      <span id="botName">Cue</span>
      <span class="sep">·</span>
      <span id="statusText">listening</span>
      <span class="muted-badge" id="mutedBadge" hidden>muted</span>
    </header>

    <section class="view idle active" id="view-idle">
      <div class="idle-mark">
        <img class="logo" src="logo.svg" alt="cue">
        <p class="listening">Listening</p>
        <p class="hint">Say "Cue, …" to ask for something.</p>
      </div>
      <p class="ticker" id="ticker"></p>
    </section>

    <section class="view slide sheet" id="view-slide">
      <h1 id="slideTitle"></h1>
      <ul id="slideBullets"></ul>
    </section>

    <section class="view diagram sheet" id="view-diagram">
      <h1 id="diagramTitle"></h1>
      <div class="diagram-box" id="diagramBox"></div>
    </section>

    <!-- Answer first, then the evidence: the answer is read from across a call, the page
         excerpt shows where it came from. -->
    <section class="view research sheet" id="view-research">
      <div class="answer">
        <p class="kicker" id="researchKicker"></p>
        <h1 class="headline" id="researchHeadline"></h1>
        <p class="context" id="researchSummary"></p>
        <p class="source-chip"><img id="researchIcon" alt=""><span id="researchSource"></span></p>
      </div>
      <figure class="excerpt" id="researchExcerpt">
        <figcaption id="researchPageTitle"></figcaption>
        <blockquote id="researchQuote"></blockquote>
        <p class="dots" id="researchDots"></p>
      </figure>
    </section>

    <section class="view video" id="view-video">
      <h1 id="videoTitle"></h1>
      <div class="video-box" id="videoBox"></div>
    </section>

    <!-- Covers everything when the humans ask Cue to get off the screen. -->
    <div class="cover" id="cover" hidden>
      <p>Screen paused</p>
      <p class="hint">Say "Cue, show your screen" to bring it back.</p>
    </div>

    <footer class="caption" id="caption"></footer>
  </main>

  <!-- Only shown with ?test=1: type transcript lines without a meeting. -->
  <form class="testpanel" id="testpanel" hidden>
    <strong>Test transcript</strong>
    <input id="testSpeaker" value="Alex" aria-label="Speaker">
    <textarea id="testText" rows="3" placeholder="Say something… (Enter to send)"></textarea>
    <div class="row">
      <button type="submit">Send line</button>
      <button type="button" id="thinkNow">Think now</button>
      <button type="button" id="demoScript">Demo script</button>
    </div>
    <pre id="testLog"></pre>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
